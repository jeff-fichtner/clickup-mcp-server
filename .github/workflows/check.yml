name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Tests (no install, as the server runs)
        run: node --test
      - name: Install the type checker
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
